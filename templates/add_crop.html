{% extends "base.html" %}
{% block title %}Add crop · AgriTech{% endblock %}
{% block content %}<h1>Record a crop</h1><section class="panel">
{% if not farmers %}<p>Register a farmer before adding a crop.</p><a class="button" href="{{ url_for('add_farmer') }}">Add farmer</a>
{% else %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="farmer_id">Farmer *</label><select id="farmer_id" name="farmer_id" required><option value="">Select farmer</option>{% for farmer in farmers %}<option value="{{ farmer.farmer_id }}">{{ farmer.name }} · {{ farmer.village }}</option>{% endfor %}</select><label for="crop_name">Crop name *</label><input id="crop_name" name="crop_name" maxlength="100" required><label for="season">Season *</label><select id="season" name="season" required><option value="">Select season</option><option>Kharif</option><option>Rabi</option><option>Zaid</option></select><label for="area_acres">Area in acres *</label><input id="area_acres" name="area_acres" type="number" min="0.01" step="0.01" required><label for="sowing_date">Sowing date</label><input id="sowing_date" name="sowing_date" type="date" max="{{ today }}"><label for="expected_yield_kg">Expected yield (kg)</label><input id="expected_yield_kg" name="expected_yield_kg" type="number" min="0.01" step="0.01"><p><button type="submit">Save crop</button></p></form>{% endif %}</section>{% endblock %}
